base_arch armv8-64
flags -march=armv8.5-a+rng
flags -mbranch-protection=bti+pac-ret

configs ARCH_AARCH64_32BIT_EL0=1
configs ARCH_AARCH64_32BIT_EL0_ALL_CORES=0
configs ARCH_AARCH64_32BIT_EL1=0
configs ARCH_AARCH64_BIG_END_ALL_CORES=1

configs ARCH_CORE_IDS=ARM_AEM
configs ARCH_ARM_PMU_HPMN_UNPREDICTABLE=1

# Optional architecture extensions in v8.0
configs ARCH_ARM_FEAT_Secure=1
configs ARCH_ARM_FEAT_PMUv3=1
configs ARCH_ARM_FEAT_ETMv4=1
configs ARCH_ARM_FEAT_CSV2=1
configs ARCH_ARM_FEAT_CSV3=1
configs ARCH_ARM_FEAT_SB=1
configs ARCH_ARM_FEAT_SPECRES=1
configs ARCH_ARM_FEAT_E2H0=1
configs ARCH_ARM_FEAT_TGran4K=1
configs ARCH_ARM_FEAT_S2TGran4K=1
configs ARCH_ARM_FEAT_TGran64K=1
configs ARCH_ARM_FEAT_S2TGran64K=1
configs ARCH_ARM_FEAT_ASID16=1
configs ARCH_ARM_FEAT_DoubleLock=1
configs ARCH_ARM_FEAT_GICv3=1

# Mandatory architecture extensions in v8.1
configs ARCH_ARM_FEAT_HPDS=1
configs ARCH_ARM_FEAT_LSE=1
configs ARCH_ARM_FEAT_LOR=1
configs ARCH_ARM_FEAT_PAN=1
configs ARCH_ARM_FEAT_RDM=1
configs ARCH_ARM_FEAT_VHE=1
configs ARCH_ARM_FEAT_CRC32=1

# Optional architecture extensions in v8.1
configs ARCH_ARM_FEAT_HAFDBS=1
configs ARCH_ARM_FEAT_VMID16=1
configs ARCH_ARM_FEAT_PMUv3p1=1
configs ARCH_ARM_PMU_VER=3
configs ARCH_ARM_FEAT_Debugv8p1=1

# Mandatory architecture extensions in v8.2
configs ARCH_ARM_FEAT_ASMv8p2=1
configs ARCH_ARM_FEAT_PAN2=1
configs ARCH_ARM_FEAT_FHM=1
configs ARCH_ARM_FEAT_DotProd=1
configs ARCH_ARM_FEAT_UAO=1
configs ARCH_ARM_FEAT_DPB=1
configs ARCH_ARM_FEAT_DPB2=1
configs ARCH_ARM_FEAT_TTCNP=1
configs ARCH_ARM_FEAT_XNX=1
configs ARCH_ARM_FEAT_IESB=1
configs ARCH_ARM_FEAT_RAS=1

# Optional architecture extensions in v8.2
configs ARCH_ARM_FEAT_FP16=1
configs ARCH_ARM_FEAT_EVT=1
configs ARCH_ARM_FEAT_Debugv8p2=1
configs ARCH_ARM_FEAT_NV=1
configs ARCH_ARM_FEAT_MPAM=1
configs ARCH_ARM_FEAT_MPAMv1p0=1

# Mandatory architecture extensions in v8.3
configs ARCH_ARM_FEAT_FCMA=1
configs ARCH_ARM_FEAT_JSCVT=1
configs ARCH_ARM_FEAT_LRCPC=1
configs ARCH_ARM_FEAT_PAuth=1
configs ARCH_ARM_FEAT_BTI=1

# Optional architecture extensions in v8.3
configs ARCH_ARM_FEAT_SPEv1p1=1
configs ARCH_ARM_FEAT_PACIMP=1
configs ARCH_ARM_FEAT_NV2=1

# Mandatory architecture extensions in v8.4
configs ARCH_ARM_FEAT_DIT=1
configs ARCH_ARM_FEAT_FlagM=1
configs ARCH_ARM_FEAT_LRCPC2=1
configs ARCH_ARM_FEAT_LSE2=1
configs ARCH_ARM_FEAT_TTL=1
configs ARCH_ARM_FEAT_S2FWB=1
configs ARCH_ARM_FEAT_IDST=1
configs ARCH_ARM_FEAT_Debugv8p4=1
configs ARCH_ARM_FEAT_TRF=1
configs ARCH_ARM_FEAT_PMUv3p4=1
configs ARCH_ARM_FEAT_DoubleFault=1
configs ARCH_ARM_FEAT_AMUv1=1
configs ARCH_ARM_FEAT_BBM=1
configs ARCH_ARM_FEAT_TLBIOS=1
configs ARCH_ARM_FEAT_TLBIRANGE=1
configs ARCH_ARM_FEAT_TTST=1

# Optional architecture extensions in v8.4
configs ARCH_ARM_FEAT_SEL2=1
configs ARCH_ARM_FEAT_MTE=1
configs ARCH_ARM_FEAT_MTE2=1
configs ARCH_ARM_FEAT_ExS=1
configs ARCH_ARM_FEAT_E0PD=1
configs ARCH_ARM_FEAT_FRINTTS=1
configs ARCH_ARM_FEAT_FlagM2=1

# Optional architecture extensions in v8.5
configs ARCH_ARM_FEAT_RNG=1
configs ARCH_ARM_FEAT_SPE=1
configs ARCH_ARM_FEAT_MTE_ASYNC=1
configs ARCH_ARM_FEAT_PMUv3p5=1

configs VGIC_HAS_EXT_SPIS=1
configs VGIC_HAS_EXT_PPIS=0

# The number of implemented ICH_LR<n>_EL2 registers.
configs CPU_GICH_LR_COUNT=16U

# The number of implemented ICH_APR[01]R<n>_EL2 registers.
configs CPU_GICH_APR_COUNT=1U

# The number of implemented DBGB[CV]R_EL1 (HW breakpoint) registers.
configs CPU_DEBUG_BP_COUNT=16U

# The number of implemented DBGW[CV]R_EL1 (HW watchpoint) registers.
configs CPU_DEBUG_WP_COUNT=16U

# The level of support for ARMv8.4-TTRem on this CPU (encoded the same way
# as ID_AA64MMFR2_EL1.BBM).
configs CPU_PGTABLE_BBM_LEVEL=2U

includes
