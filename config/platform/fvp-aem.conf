base_arch arm-aem

base_arch gic-arm-aem
base_arch mmu-arm-aem

module platform/soc_fvp
module platform/arm_arch_timer
module platform/arm_pmu
module platform/arm_rng

# Disable ASLR, KASLR to ease debugging
include include/debug_no_kaslr
include include/debug_no_rootvm_aslr

configs PLATFORM_MAX_CORES=8U
configs PLATFORM_EXISTING_CORES=0xFFU

# Four cores per cluster
configs PLATFORM_MPIDR_AFF0_MASK=0U
configs PLATFORM_MPIDR_AFF0_SHIFT=0
configs PLATFORM_MPIDR_AFF1_MASK=0x3U
configs PLATFORM_MPIDR_AFF1_SHIFT=0
configs PLATFORM_MPIDR_AFF2_MASK=0x3U
configs PLATFORM_MPIDR_AFF2_SHIFT=2
configs PLATFORM_MPIDR_AFF3_MASK=0U
configs PLATFORM_MPIDR_AFF3_SHIFT=0

configs PLATFORM_PSCI_L0_COUNTS=PLATFORM_MAX_CORES
configs PLATFORM_PSCI_L1_COUNTS=1U
configs PLATFORM_PSCI_L0_STATE_BITS=3U
configs PLATFORM_PSCI_L1_STATE_BITS=12U
configs PLATFORM_PSCI_L0_MASK=7U
configs PLATFORM_PSCI_L1_MASK=0xFFFU

configs PLATFORM_LMA_BASE=0x88000000

# TODO
# Check if we can give more DDR memory to Linux

# ARM TF-A Secure-world claims DDR above 0xff000000
configs PLATFORM_DDR_BASE=0x80000000U
configs PLATFORM_DDR_SIZE=0x7F000000U

# These define the amount of memory given to the HLOS
# which is defined in the DT loaded for linux
configs HLOS_VM_DDR_BASE=0xa0000000U
configs HLOS_VM_DDR_SIZE=0x40000000U

# Address locations where Linux kernel, DT and RAMFS are loaded.
# Use Linux and RAMFS ARM Buildroot build, provide a custom DT
# build-scripts/configs/rdv1/rdv1
configs HLOS_ENTRY_POINT=0xa0000000U
configs HLOS_DT_BASE=0xa4000000U
configs HLOS_RAM_FS_BASE=0xa6000000U

# Sanitisation of memory on reset is not supported; disable the API.
# This could potentially be implemented with PSCI_MEM_PROTECT_CHECK_RANGE
configs PLATFORM_RAM_NO_SANITISE_ON_RESET=1

configs PLATFORM_HEAP_PRIVATE_SIZE=0x200000
configs PLATFORM_RW_DATA_SIZE=0x200000
configs PLATFORM_ROOTVM_LMA_BASE=0x88480000U
configs PLATFORM_ROOTVM_LMA_SIZE=0x100000U
configs PLATFORM_PHYS_ADDRESS_BITS=36
configs PLATFORM_VM_ADDRESS_SPACE_BITS=36
configs PLATFORM_PGTABLE_4K_GRANULE=1

configs PLATFORM_ARCH_TIMER_FREQ=100000000
configs PLATFORM_HYP_ARCH_TIMER_IRQ=26U
configs PLATFORM_VM_ARCH_VIRTUAL_TIMER_IRQ=27U
configs PLATFORM_VM_ARCH_PHYSICAL_TIMER_IRQ=30U

# From HW memmap:
# https://developer.arm.com/documentation/100964/1130/Base-Platform/Base---memory/Base-Platform-memory-map?lang=en
configs PLATFORM_GIC_BASE=0x2f000000U

configs PLATFORM_GICR_COUNT=PLATFORM_MAX_CORES
configs PLATFORM_MAX_CLUSTERS=1U
configs PLATFORM_MAX_HIERARCHY=1U
configs PLATFORM_GITS_COUNT=1U
configs PLATFORM_GICH_IRQ=25U

configs PLATFORM_IPI_LINES=8
configs PLATFORM_PMU_IRQ=23U
configs PLATFORM_VM_PMU_IRQ=23U
configs PLATFORM_PMU_CNT_NUM=6
configs PLATFORM_AMU_CNT_NUM=4U
configs PLATFORM_AMU_AUX_CNT_NUM=3U

configs PLATFORM_IDLE_WAKEUP_NOWAIT=1

# Configure a UART for Linux Early Printk to use
# It assumes the bootloader enabled the UART specified in the DT
configs PLATFORM_PVM_UART_BASE=0x1c0b0000 PLATFORM_PVM_UART_SIZE=0x1000U

# HYP can use a separate UART for its own logs. No conflict
configs PLATFORM_HYP_UART_BASE=0x1c0a0000 PLATFORM_HYP_UART_SIZE=0x1000U

configs QCBOR_ENV_CONFIG_SIZE=0x4000

configs GICV3_EXT_IRQS=1

configs PLATFORM_SMMU_V3_BASE=0x2b400000 PLATFORM_SMMU_V3_SIZE=0x100000U
configs PLATFORM_SMMU_V3_TCU_COUNT=1U
configs PLATFORM_SMMU_V3_NUM_TCU_IRQS=4U
configs PLATFORM_SMMU_V3_TCU1_PMU_IRQ=71U
configs PLATFORM_SMMU_V3_TCU1_PMU_IRQ_MODE=IRQ_TRIGGER_EDGE_RISING
configs PLATFORM_SMMU_V3_TCU1_EVENTQ_IRQ=74U
configs PLATFORM_SMMU_V3_TCU1_CMDSYNC_IRQ=77U
configs PLATFORM_SMMU_V3_TCU1_GLOBAL_IRQ=79U

# What is the highest SID we expect on this platform?
# This is used to setup the Stream Table.
# The PCI BDF range
# For PCI a split of 8 is appropriate to match the BDF format.
configs PLATFORM_SMMU_V3_HIGHEST_SID=0xFFFFU
configs PLATFORM_SMMU_V3_SPLIT=10U

# With SMMUv3 pass-through Linux can configure the SMMU directly,
# it can help with HW testing using Linux drivers.
# These settings should match the RM settings and base DT.
# If pass-through is disabled HYP will take ownership of the SMMUv3
# Bypass needs manual changes to the DT to remove the SMMU from PVM
configs SMMU_V3_ENABLE=1
configs SMMU_V3_PASSTHROUGH=0
configs SMMU_V3_GLOBAL_BYPASS=0

# There are a few options wrt handling spurious unknown
# streams (i.e. A stream-table miss).
# 1) Let the hardware abort and not report any unconfigured NS streams
# 2) Let the hardware report unconfigured NS streams and we just log them
# 3) Let the hardware report unconfigured NS streams and we try to 'mute' those.
#    -> This means we need to go and make individual STEs for the specific stream
#       and disable reporting for it.
#       If there are many streams that will turn into whack-a-mole and consume
#       some memory for every entry.
# For now we want to see if there is any misbehaving devices and we just report those.
configs SMMU_V3_ENABLE_GLOBAL_BAD_STREAM_REPORTING=1
configs SMMU_V3_DISABLE_INDIVIDUAL_BAD_STREAMS=1

# FEAT_BBM is 0 for this Model
arch_configs_override fvp-aem CPU_PGTABLE_BBM_LEVEL=0U
# Need this else we fail to boot
configs PLATFORM_PGTABLE_AVOID_BBM=1

configs PLATFORM_VGIC_ITS_EVENT_BITS=8
configs PLATFORM_ITS_DEVICE_ID_BITS=16

# The SMMUv3 feature flags as provided to VMs
# Use the default values from the MMU-600 as on FVP
configs PLATFORM_VIRTIO_IOMMU_ATTACH_TABLE_IDR0=0x080E7E3FU
configs PLATFORM_VIRTIO_IOMMU_ATTACH_TABLE_IDR1=0x0E739D18U
configs PLATFORM_VIRTIO_IOMMU_ATTACH_TABLE_IDR2=0x0U
configs PLATFORM_VIRTIO_IOMMU_ATTACH_TABLE_IDR3=0x1CU
configs PLATFORM_VIRTIO_IOMMU_ATTACH_TABLE_IDR4=0x0U
configs PLATFORM_VIRTIO_IOMMU_ATTACH_TABLE_IDR5=0x02000075U

# Minimum root heap size (platform-specific)
configs PLATFORM_MINIMUM_ROOT_HEAP_SIZE=0x40000U
configs EXTRA_PRIVATE_HEAP_SIZE=0x100000U EXTRA_ROOT_HEAP_SIZE=0x300000U

configs TRACE_BOOT_ENTRIES=128 PER_CPU_TRACE_ENTRIES=4096 TRACE_FORMAT=1
configs TRACE_AREA_SIZE=0x2000000U

quality_configs_override production-unchecked PER_CPU_TRACE_ENTRIES=512
quality_configs_override production-unchecked TRACE_AREA_SIZE=0x200000U
